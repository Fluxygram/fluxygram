name: CLA

# Pide a cada contribuidor externo que firme CLA.md una vez, comentando en su PR.
# Las firmas se guardan en la rama cla-signatures (signatures/v1/cla.json).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Fluxygram/fluxygram/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: salamancacm,Fluxygram,*[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before we can merge it, please read the
            [Contributor License Agreement](https://github.com/Fluxygram/fluxygram/blob/main/CLA.md)
            and sign it by posting the comment below. You only need to do this once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
