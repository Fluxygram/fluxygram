name: Feature request
description: Suggest something concrete for Fluxygram
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: For open-ended ideas, [Discussions](https://github.com/Fluxygram/fluxygram/discussions/categories/ideas) is a better place.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or the diagram you want to make. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. A sketch of the JSON helps if it's a format change.
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Workarounds or alternatives you've considered.
