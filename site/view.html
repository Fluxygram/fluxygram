<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fluxygram</title>
    <meta name="description" content="An animated diagram made with Fluxygram." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fluxygram" />
    <meta property="og:title" content="Fluxygram" />
    <meta property="og:description" content="An animated diagram made with Fluxygram." />
    <meta property="og:url" content="https://fluxygram.app/view" />
    <meta property="og:image" content="https://fluxygram.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fluxygram: diagrams that explain themselves" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#09090c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/site.css" />
    <style>
      body { min-height: 100dvh; display: flex; flex-direction: column; }
      .view-main { flex: 1; display: grid; place-items: center; padding: 8px 20px 40px; }
      .view-main fluxy-gram { width: min(100%, 1040px); }
      .view-missing { color: var(--muted); }
      .view-logo { max-height: 34px; max-width: 220px; }
      .view-lock { display: grid; gap: 12px; width: min(100%, 360px); text-align: center; }
      .view-lock h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
      .view-lock p { margin: 0 0 6px; color: var(--muted); }
      .view-lock input { height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; font-size: 16px; }
      .view-lock small { min-height: 1.2em; color: #ff6b6b; }
      .view-lock .btn { justify-content: center; }
      body[data-brand='light'] { background: #fbfbfc; color: #17171c; }
      body[data-brand='light'] .btn { background: #ffffff; color: #17171c; border: 1px solid #e3e3e8; box-shadow: none; }
    </style>
  </head>
  <body>
    <header class="wrap nav">
      <a class="brand" href="/"><img src="/mark.svg" alt="" width="32" height="32" />fluxygram</a>
      <nav class="nav-links">
        <a class="btn" id="present" href="/present" data-i18n="ed.present">Present</a>
        <a class="btn" id="edit" href="/play" data-i18n="view.edit">Edit a copy</a>
      </nav>
    </header>
    <main class="view-main">
      <fluxy-gram id="diagram" gestures="full"></fluxy-gram>
      <p class="view-missing" id="missing" hidden data-i18n="view.missing"></p>
    </main>
    <script src="/i18n.js"></script>
    <script type="module" src="/src/view.ts"></script>
  </body>
</html>
