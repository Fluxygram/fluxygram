<!doctype html>
<!--
  Fuente de la imagen para compartir (public/og.png, 1200×630). No se publica: solo existe en el servidor de desarrollo.
  Se regenera con `node scripts/og.mjs` mientras corre `pnpm dev`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fluxygram share image</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        background: #09090c; color: #f3f3f6;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      }
      /* Cuadrícula de puntos, como el lienzo del editor, que se desvanece hacia abajo */
      body::before {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(circle, #2a2a33 1.2px, transparent 1.4px); background-size: 24px 24px;
        mask-image: linear-gradient(180deg, #000 0%, rgb(0 0 0 / 0.35) 70%, transparent 100%);
      }
      .glow {
        position: absolute; width: 720px; height: 420px; right: -160px; bottom: -200px; border-radius: 50%;
        background: radial-gradient(closest-side, rgb(43 255 136 / 0.16), transparent);
      }
      .top { position: absolute; top: 56px; left: 72px; right: 72px; }
      .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
      .brand img { width: 40px; height: 40px; }
      h1 { margin: 40px 0 0; white-space: nowrap; font-size: 62px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 650; max-width: 900px; }
      h1 em { font-style: normal; color: #2bff88; }
      p { margin: 18px 0 0; font-size: 26px; line-height: 1.35; color: #9b9ba8; max-width: 860px; letter-spacing: -0.01em; }
      .diagram { position: absolute; left: 72px; right: 72px; bottom: 44px; }
      .diagram fluxy-gram { display: block; }
      .url { position: absolute; top: 64px; right: 72px; font-size: 22px; color: #9b9ba8; letter-spacing: -0.01em; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="top">
      <div class="brand"><img src="/mark.svg" alt="" />fluxygram</div>
      <h1>Diagrams that <em>explain themselves.</em></h1>
      <p>Describe anything in JSON. Fluxygram draws it and tells it step by step, with motion that helps people understand.</p>
    </div>
    <div class="url">fluxygram.app</div>
    <div class="diagram">
      <fluxy-gram id="d" lang="en" mode="tracker" stage="out" autoplay="false"></fluxy-gram>
    </div>
    <script type="module">
      import '@fluxygram/element';
      const d = document.getElementById('d');
      d.diagram = {
        type: 'flow',
        nodes: [
          { id: 'idea', label: 'Describe it', description: 'in a JSON file', icon: 'message', kind: 'start' },
          { id: 'json', label: '.flux.json', description: 'nodes, edges, steps', icon: 'code' },
          { id: 'core', label: 'Fluxygram', description: 'layout + motion', icon: 'workflow' },
          { id: 'out', label: 'Animated diagram', description: 'on any page', icon: 'rocket', kind: 'end' },
        ],
        edges: [
          { from: 'idea', to: 'json' },
          { from: 'json', to: 'core' },
          { from: 'core', to: 'out' },
        ],
      };
      await document.fonts.ready;
      // Deja terminar la animación de entrada antes de la captura.
      setTimeout(() => document.body.setAttribute('data-ready', ''), 2500);
    </script>
  </body>
</html>
