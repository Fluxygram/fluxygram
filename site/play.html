<!doctype html>
<html lang="en" data-i18n-title="play.title">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground — Fluxygram</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/site.css" />
  </head>
  <body>
    <header class="wrap nav" style="max-width: none">
      <a class="brand" href="/"><img src="/mark.svg" alt="" width="26" height="26" />fluxygram</a>
      <nav class="nav-links">
        <a href="/#examples" data-i18n="nav.examples">Examples</a>
        <a href="/schema/v1.json" data-i18n="nav.schema">Schema</a>
        <a class="gh" href="https://github.com/Fluxygram" rel="noopener" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a>
        <button class="lang-switch" type="button" data-lang-switch>Español</button>
      </nav>
    </header>
    <main class="wrap play" style="max-width: none">
      <div class="editor">
        <div class="editor-bar">
          <select id="preset" data-i18n-attr="aria-label:play.preset">
            <option value="how-it-works" data-i18n="play.p.how">How Fluxygram works</option>
            <option value="order" data-i18n="play.p.order">Flow: an order</option>
            <option value="architecture" data-i18n="play.p.arch">Architecture: an app</option>
            <option value="web-history" data-i18n="play.p.web">Timeline: the web</option>
          </select>
          <span class="editor-status" id="status" aria-live="polite"></span>
        </div>
        <textarea id="source" spellcheck="false" data-i18n-attr="aria-label:play.source"></textarea>
      </div>
      <div class="preview">
        <fluxy-gram id="preview"></fluxy-gram>
      </div>
    </main>
    <script src="/i18n.js"></script>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
