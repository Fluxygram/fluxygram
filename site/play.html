<!doctype html>
<html lang="en" data-i18n-title="play.title">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor — Fluxygram</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/site.css" />
    <link rel="stylesheet" href="/src/editor/editor.css" />
  </head>
  <body class="ed-body-page">
    <header class="ed-top">
      <a class="brand" href="/"><img src="/mark.svg" alt="" width="24" height="24" />fluxygram</a>

      <div class="ed-seg" id="type" role="radiogroup">
        <button type="button" role="radio" data-type="flow" data-i18n="examples.flow">Flow</button>
        <button type="button" role="radio" data-type="architecture" data-i18n="examples.architecture">Architecture</button>
        <button type="button" role="radio" data-type="timeline" data-i18n="examples.timeline">Timeline</button>
      </div>

      <div class="ed-spacer"></div>

      <div class="ed-tools">
        <button type="button" class="ed-icon" id="undo" data-i18n-attr="aria-label:ed.undo;title:ed.undo"></button>
        <button type="button" class="ed-icon" id="redo" data-i18n-attr="aria-label:ed.redo;title:ed.redo"></button>
        <button type="button" class="ed-icon" id="auto" data-i18n-attr="aria-label:ed.auto;title:ed.auto"></button>
        <button type="button" class="ed-icon" id="fit" data-i18n-attr="aria-label:ed.fit;title:ed.fit"></button>
        <span class="ed-sep"></span>
        <select id="examples" data-i18n-attr="aria-label:ed.examples">
          <option value="" data-i18n="ed.examples">Examples</option>
          <option value="how-it-works" data-i18n="play.p.how">How Fluxygram works</option>
          <option value="order" data-i18n="play.p.order">Flow: an order</option>
          <option value="architecture" data-i18n="play.p.arch">Architecture: an app</option>
          <option value="web-history" data-i18n="play.p.web">Timeline: the web</option>
        </select>
        <button type="button" class="ed-icon" id="new" data-i18n-attr="aria-label:ed.new;title:ed.new"></button>
        <button type="button" class="ed-icon" id="open" data-i18n-attr="aria-label:ed.open;title:ed.open"></button>
        <button type="button" class="ed-icon" id="download" data-i18n-attr="aria-label:ed.download;title:ed.download"></button>
        <button type="button" class="ed-icon" id="export" data-i18n-attr="aria-label:ed.export;title:ed.export"></button>
        <button type="button" class="ed-btn" id="share"><span data-i18n="ed.share">Share</span></button>
        <button type="button" class="ed-btn ed-primary" id="preview"><span data-i18n="ed.preview">Play</span></button>
        <button type="button" class="ed-icon" id="tour" data-i18n-attr="aria-label:tour.help;title:tour.help"></button>
        <button class="lang-switch" type="button" data-lang-switch>Español</button>
      </div>
    </header>

    <main class="ed-main">
      <div class="ed-stage" id="stage">
        <div class="ed-palette" id="palette"></div>
        <p class="ed-empty" id="empty" data-i18n="ed.empty"></p>
        <div class="ed-dropzone" id="dropzone"><span data-i18n="ed.drop"></span></div>
        <div class="ed-zoom">
          <button type="button" class="ed-icon" id="zoomOut" data-i18n-attr="aria-label:ed.zoomOut;title:ed.zoomOut"></button>
          <button type="button" class="ed-icon" id="zoomIn" data-i18n-attr="aria-label:ed.zoomIn;title:ed.zoomIn"></button>
        </div>
      </div>

      <aside class="ed-side">
        <div class="ed-tabs" role="tablist">
          <button type="button" role="tab" aria-selected="true" data-tab="props" data-i18n="ed.tab.props">Properties</button>
          <button type="button" role="tab" aria-selected="false" data-tab="json" data-i18n="ed.tab.json">JSON</button>
        </div>
        <div class="ed-panel" id="props"></div>
        <div class="ed-panel" id="jsonPanel" hidden>
          <div class="ed-json-status" id="jsonStatus"></div>
          <textarea id="json" spellcheck="false" data-i18n-attr="aria-label:play.source"></textarea>
        </div>
      </aside>

      <section class="ed-steps" id="steps"></section>
    </main>

    <div class="ed-modal" id="modal" hidden>
      <div class="ed-modal-box">
        <button type="button" class="ed-icon ed-modal-close" id="modalClose" data-i18n-attr="aria-label:ed.close;title:ed.close"></button>
        <fluxy-gram id="player" gestures="full"></fluxy-gram>
      </div>
    </div>
    <div class="ed-toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/i18n.js"></script>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
